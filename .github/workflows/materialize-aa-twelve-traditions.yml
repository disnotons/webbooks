name: Materialize AA Twelve Traditions source (one-shot)

on:
  pull_request:
    branches: [main]
    paths:
      - '.aa-twelve-traditions-pr-trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Recover and verify exact 75-MD source package from GitHub
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/aa-source-stage
          rm -rf "$stage" /tmp/aa-traditions-src
          mkdir -p "$stage" /tmp/aa-traditions-src
          base='https://raw.githubusercontent.com/disnotons/GPT/main/.webbook-upload/aa-traditions-detailed'
          for name in part-00.b64 part-01.b64 part-02.b64 part-03.b64 part-04.b64 part-05.b64 part-06.b64 part-07.b64 part-08.b64 part-04-new.b64 part-05-new.b64 part-06-new.b64; do
            curl -fsSL "$base/$name" -o "$stage/$name"
          done
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib, io, shutil, tarfile

          stage = Path('/tmp/aa-source-stage')
          root = Path('/tmp/aa-traditions-src')
          candidates = [
              ['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05.b64','part-06.b64','part-07.b64','part-08.b64'],
              ['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04-new.b64','part-05-new.b64','part-06-new.b64','part-07.b64','part-08.b64'],
          ]
          expected_package = 'f924aacf39ebf5b78002a4a24921997483b93d3227cc0ea43606bd99a74c2b5a'
          expected_book = 'b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7'
          source = None
          for idx, names in enumerate(candidates, 1):
              out = root / f'candidate-{idx}'
              shutil.rmtree(out, ignore_errors=True)
              out.mkdir(parents=True)
              try:
                  encoded = ''.join((stage / name).read_text(encoding='ascii') for name in names)
                  raw = base64.b64decode(''.join(encoded.split()), validate=True)
                  tar_bytes = bz2.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
                      tf.extractall(out, filter='data')
                  files = sorted(out.rglob('*.md'), key=lambda p: p.name.encode('utf-8'))
                  if len(files) != 75:
                      continue
                  payload = b''.join(hashlib.sha256(p.read_bytes()).hexdigest().encode() + b'\n' for p in files)
                  package_digest = hashlib.sha256(payload).hexdigest()
                  print(f'candidate {idx} package digest: {package_digest}')
                  if package_digest == expected_package:
                      source = out
                      break
              except Exception as exc:
                  print(f'candidate {idx} rejected: {exc}')
          if source is None:
              raise SystemExit('No GitHub source candidate matches the current uploaded 75-MD package.')
          files = list(source.rglob('*.md'))
          integrated = [p for p in files if p.name == 'AA_12전통_상세분석해설_전체통합본_친절한설명조.md']
          if len(integrated) != 1:
              raise SystemExit(f'integrated source count: {len(integrated)}')
          book_hash = hashlib.sha256(integrated[0].read_bytes()).hexdigest()
          if book_hash != expected_book:
              raise SystemExit(f'book hash mismatch: {book_hash}')
          Path('/tmp/integrated-path').write_text(str(integrated[0]), encoding='utf-8')
          print('verified exact source package and integrated book')
          PY
          mkdir -p books/recovery/aa/twelve-traditions
          cp "$(cat /tmp/integrated-path)" books/recovery/aa/twelve-traditions/book.md
          test "$(sha256sum books/recovery/aa/twelve-traditions/book.md | awk '{print $1}')" = 'b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7'

      - name: Replace temporary main history with one final publication commit
        shell: bash
        run: |
          set -euo pipefail
          base='e7bbedc7403e853b7b67fb5bbeffea9a5839a2d9'
          git checkout "$base" -- .github/workflows/materialize-aa-twelve-traditions.yml .github/workflows/deploy-pages.yml
          git add books/recovery/aa/twelve-traditions/book.md
          git add .github/workflows/materialize-aa-twelve-traditions.yml .github/workflows/deploy-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft "$base"
          git commit -m 'Publish AA Twelve Traditions exact source'
          changed="$(git diff --name-only HEAD^)"
          printf '%s\n' "$changed"
          test "$changed" = 'books/recovery/aa/twelve-traditions/book.md'
          git push --force-with-lease origin HEAD:main
