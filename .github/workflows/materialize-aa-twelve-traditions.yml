name: Materialize AA Twelve Traditions source (one-shot)

on:
  pull_request:
    branches: [main]
    paths:
      - '.aa-book-tail.u15'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ github.event.pull_request.head.sha }}'
          git fetch origin "$head_sha"
          git show FETCH_HEAD:.aa-book-tail.u15 > /tmp/aa-book-tail.u15

          stage=/tmp/aa-prefix
          rm -rf "$stage"
          mkdir -p "$stage"
          base='https://raw.githubusercontent.com/disnotons/GPT/main/.webbook-upload/aa-traditions-detailed'
          for name in part-00.b64 part-01.b64 part-02.b64 part-03.b64 current-part-04.b64 part-05-new.b64 current-part-06.b64 current-part-07.b64 current-part-08.b64 current-part-09.b64; do
            curl -fsSL "$base/$name" -o "$stage/$name"
          done

          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib

          stage = Path('/tmp/aa-prefix')
          names = [
              'part-00.b64','part-01.b64','part-02.b64','part-03.b64',
              'current-part-04.b64','part-05-new.b64','current-part-06.b64',
              'current-part-07.b64','current-part-08.b64','current-part-09.b64',
          ]
          expected_slice_hashes = [
              '12d004c9822cc15a2fe67249c4b0f9bcd4ce93f5f6c74684b7b7247a203e497a',
              'bc2c57082c398017d807cd28b2e8c67aeb03de2b81c18dee50838724b7742b06',
              '0e70b3ac0569d0d56956a3e77b81bb16fde7579da049e5e153d47e9b4ea57616',
              '7e5dd368b170688c50a2247c047b027b5a69b3e0caae770eabb202ebb641a5d6',
              'babc74983bbbc3e5f5581ecb992459dbeaba8fdab573cb3b8152322e5c2835b3',
              '601a8dc8dcbb5fbf0e99a9b7bc0e4d14d5a4e42ae39a526872bf2c0d6e4c0617',
              '57d4644112af568405c5288a836471d5f55700f2be8db53bad93cea865ddcc3b',
              'afbc27069c4e0e01dafe9c659eeabccab8be2929ae30618a1efb0f1d8b9e8bf3',
              '0929c422daad626acc18f3c16f461b173bf9c4a0b8dbb20087e19089cd466cc7',
              '89f3d7865dfb6a2ff451bf1cd5489984179384172e6cb63607a1bfa488613180',
          ]
          texts = []
          for name, expected in zip(names, expected_slice_hashes):
              txt = ''.join((stage / name).read_text(encoding='ascii').split())
              got = hashlib.sha256(txt.encode()).hexdigest()
              if got != expected:
                  raise SystemExit(f'slice hash mismatch {name}: {got}')
              texts.append(txt)
          prefix = base64.b64decode(''.join(texts), validate=True)
          if len(prefix) != 135000:
              raise SystemExit(f'prefix length mismatch: {len(prefix)}')
          if hashlib.sha256(prefix).hexdigest() != 'd7776111b6d6e5fbff2379fb2ad9a0ed4476dbf78d1de50fefe2d066978dac7d':
              raise SystemExit('prefix digest mismatch')

          s = Path('/tmp/aa-book-tail.u15').read_text(encoding='utf-8')
          bitbuf = 0
          nbits = 0
          out = bytearray()
          for ch in s:
              v = ord(ch) - 0x3400
              if not 0 <= v < 32768:
                  raise SystemExit('invalid tail transfer character')
              bitbuf = (bitbuf << 15) | v
              nbits += 15
              while nbits >= 8:
                  nbits -= 8
                  out.append((bitbuf >> nbits) & 0xff)
                  bitbuf &= (1 << nbits) - 1 if nbits else 0
          if nbits:
              raise SystemExit('unexpected tail padding')
          tail = bytes(out)
          if len(tail) != 126855:
              raise SystemExit(f'tail length mismatch: {len(tail)}')
          if hashlib.sha256(tail).hexdigest() != '0e1ec73e744f8647cc8ab4636eb26513575ef1054dc782b8e5ac3f8d0f43d420':
              raise SystemExit('tail digest mismatch')

          compressed = prefix + tail
          if len(compressed) != 261855:
              raise SystemExit('compressed length mismatch')
          if hashlib.sha256(compressed).hexdigest() != 'dccab0119d8c2f14f7e2a7f9d61484ae7f8e33b20b97b24ddbf0073d6c9f2560':
              raise SystemExit('compressed digest mismatch')
          book = bz2.decompress(compressed)
          if len(book) != 1688018:
              raise SystemExit(f'book length mismatch: {len(book)}')
          if hashlib.sha256(book).hexdigest() != 'b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7':
              raise SystemExit('book digest mismatch')
          target = Path('books/recovery/aa/twelve-traditions/book.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(book)
          print('verified exact integrated source:', hashlib.sha256(book).hexdigest())
          PY

      - name: Replace temporary history with one publication commit
        shell: bash
        run: |
          set -euo pipefail
          base='e7bbedc7403e853b7b67fb5bbeffea9a5839a2d9'
          git checkout "$base" -- .github/workflows/materialize-aa-twelve-traditions.yml .github/workflows/deploy-pages.yml
          git add -- books/recovery/aa/twelve-traditions/book.md
          git add -- .github/workflows/materialize-aa-twelve-traditions.yml .github/workflows/deploy-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft "$base"
          changed="$(git diff --cached --name-only "$base")"
          printf '%s\n' "$changed"
          test "$changed" = 'books/recovery/aa/twelve-traditions/book.md'
          git commit -m 'Publish AA Twelve Traditions exact source'
          git push --force-with-lease origin HEAD:main

  deploy:
    needs: materialize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout final main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Stage site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R site _site
          mkdir -p _site/recovery/aa/twelve-traditions
          cp books/recovery/aa/twelve-traditions/book.md _site/recovery/aa/twelve-traditions/book.md
          cp books/recovery/aa/twelve-traditions/book.yaml _site/recovery/aa/twelve-traditions/book.yaml
          test "$(sha256sum _site/recovery/aa/twelve-traditions/book.md | awk '{print $1}')" = 'b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
