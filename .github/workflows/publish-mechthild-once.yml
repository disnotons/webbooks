name: Recover and publish Mechthild webbook once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mechthild-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover existing verified transfer package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          upload = Path('.webbook-upload/mechthild')
          parts = sorted(upload.glob('part-*.txt'))
          if len(parts) != 4:
              raise SystemExit(f'Expected 4 recovery parts, found {len(parts)}')
          text = ''.join(p.read_text(encoding='utf-8') for p in parts)
          acc = 0
          nbits = 0
          out = bytearray()
          for ch in text:
              v = ord(ch) - 0x3400
              if not 0 <= v < 32768:
                  raise SystemExit('Invalid transfer character')
              acc = (acc << 15) | v
              nbits += 15
              while nbits >= 8:
                  nbits -= 8
                  out.append((acc >> nbits) & 0xff)
                  acc &= (1 << nbits) - 1 if nbits else 0
          Path('/tmp/mechthild-package.tar.xz').write_bytes(bytes(out[:414820]))
          PY2
          echo '501111bed63f5cbcd9dc75c5baa47f0e4eafdcd6719cddd0f82fc269ca0f0231  /tmp/mechthild-package.tar.xz' | sha256sum -c -
          rm -rf /tmp/mechthild-package
          mkdir -p /tmp/mechthild-package
          tar -xJf /tmp/mechthild-package.tar.xz -C /tmp/mechthild-package
          test -d /tmp/mechthild-package/books/christianity/mechthild/chapters

      - name: Verify all 44 Markdown bodies against current source package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import hashlib
          import json, base64
          expected = json.loads(base64.b64decode(''))
          root = Path('/tmp/mechthild-package/books/christianity/mechthild/chapters')
          files = sorted(root.glob('*.md'))
          if len(files) != 44:
              raise SystemExit(f'Expected 44 chapters, found {len(files)}')
          actual_names = {p.name for p in files}
          if actual_names != set(expected):
              missing = sorted(set(expected) - actual_names)
              extra = sorted(actual_names - set(expected))
              raise SystemExit(f'Filename mismatch. missing={missing} extra={extra}')
          for p in files:
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != expected[p.name]:
                  raise SystemExit(f'Body hash mismatch: {p.name}')
          print('Verified 44 byte-identical Markdown chapters.')
          PY2

      - name: Install publication without overwriting an existing book
        shell: bash
        run: |
          set -euo pipefail
          test ! -e 'books/christianity/mechthild'
          mkdir -p books/christianity
          cp -a /tmp/mechthild-package/books/christianity/mechthild books/christianity/
          test "$(find books/christianity/mechthild/chapters -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = '44'

      - name: Add Mechthild reader and library entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/christianity/mechthild
          cp site/recovery/aa/twelve-traditions/style.css site/christianity/mechthild/style.css
          cp site/recovery/aa/twelve-traditions/app.js site/christianity/mechthild/app.js
          cat > site/christianity/mechthild/index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="메히틸트 폰 마그데부르크 『신성의 흐르는 빛』 해설"><title>메히틸트 폰 마그데부르크 『신성의 흐르는 빛』 해설</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script></head><body><div id="progress"></div><header><button id="menu" aria-label="목차 열기">☰</button><a class="library-link" href="../../">Webbooks</a><div class="brand"><strong>『신성의 흐르는 빛』</strong><span>메히틸트 폰 마그데부르크 · 상세 해설</span></div><div class="right"><a href="./book.md">통합 MD</a><button id="theme" aria-label="테마 전환">◐</button></div></header><div class="layout"><aside><label class="search-label" for="search">목차 검색</label><input id="search" type="search" placeholder="예: 3.2, 사랑"><nav id="toc"></nav></aside><main><article id="content">웹북을 불러오는 중입니다…</article><nav class="pager"><button id="prev">← 이전</button><span id="pos"></span><button id="next">다음 →</button></nav></main></div><button id="top" aria-label="맨 위로">↑</button><script src="./app.js"></script></body></html>
          HTML
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="웹북 도서관"><title>Webbooks</title><link rel="stylesheet" href="./assets/library.css"></head><body><main class="library"><header><p class="eyebrow">WEBBOOK LIBRARY</p><h1>웹북 도서관</h1><p>연구·해설 프로젝트에서 완성된 원고를 읽기 좋은 웹북으로 제공합니다.</p></header><section><h2>기독교 · 신비주의</h2><a class="book" href="./christianity/mechthild/"><span class="meta">메히틸트 폰 마그데부르크 · 완결</span><strong>『신성의 흐르는 빛』 상세 해설</strong><span>0.1부터 7.9까지 순서대로 읽는 44편의 상세 해설.</span></a></section><section><h2>회복 · AA</h2><a class="book" href="./recovery/aa/twelve-traditions/"><span class="meta">AA 12단계·12전통 · 완결</span><strong>AA Twelve Traditions 상세 분석·해설</strong><span>Tradition One 1.1부터 Tradition Twelve 12.6, Long Form A.1~A.4까지.</span></a></section></main></body></html>
          HTML

      - name: Update Pages staging workflow for Mechthild
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy webbooks to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v6
                - name: Stage site
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf _site
                    cp -R site _site
                    mkdir -p _site/recovery/aa/twelve-traditions
                    cp books/recovery/aa/twelve-traditions/book.md _site/recovery/aa/twelve-traditions/book.md
                    cp books/recovery/aa/twelve-traditions/book.yaml _site/recovery/aa/twelve-traditions/book.yaml
                    test "$(sha256sum _site/recovery/aa/twelve-traditions/book.md | awk '{print $1}')" = "b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7"
                    mkdir -p _site/christianity/mechthild
                    : > _site/christianity/mechthild/book.md
                    for f in books/christianity/mechthild/chapters/*.md; do
                      cat "$f" >> _site/christianity/mechthild/book.md
                      printf '%s\n' '' '---' '' >> _site/christianity/mechthild/book.md
                    done
                    cp books/christianity/mechthild/book.yaml _site/christianity/mechthild/book.yaml
                    cp books/christianity/mechthild/manifest.json _site/christianity/mechthild/manifest.json
                    test "$(find books/christianity/mechthild/chapters -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "44"
                - name: Setup Pages
                  uses: actions/configure-pages@v5
                - name: Upload artifact
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: _site
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Commit publication and remove temporary recovery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/christianity/mechthild
          git add site/index.html site/christianity/mechthild
          git add .github/workflows/deploy-pages.yml
          git rm -r .webbook-upload/mechthild
          git rm .github/workflows/publish-mechthild-once.yml
          git commit -m 'Publish Mechthild webbook'
          git push origin HEAD:main

      - name: Stage current site for immediate Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R site _site
          mkdir -p _site/recovery/aa/twelve-traditions
          cp books/recovery/aa/twelve-traditions/book.md _site/recovery/aa/twelve-traditions/book.md
          cp books/recovery/aa/twelve-traditions/book.yaml _site/recovery/aa/twelve-traditions/book.yaml
          mkdir -p _site/christianity/mechthild
          : > _site/christianity/mechthild/book.md
          for f in books/christianity/mechthild/chapters/*.md; do
            cat "$f" >> _site/christianity/mechthild/book.md
            printf '%s\n' '' '---' '' >> _site/christianity/mechthild/book.md
          done
          cp books/christianity/mechthild/book.yaml _site/christianity/mechthild/book.yaml
          cp books/christianity/mechthild/manifest.json _site/christianity/mechthild/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
