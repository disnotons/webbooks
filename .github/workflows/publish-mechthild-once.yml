name: Publish verified Mechthild webbook once

on:
  pull_request:
    branches: [main]
    paths:
      - '.mechthild-pr-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover existing transfer package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, tarfile
          upload = Path('.webbook-upload/mechthild')
          parts = sorted(upload.glob('part-*.txt'))
          if len(parts) != 4:
              raise SystemExit(f'Expected 4 recovery parts, found {len(parts)}')
          text = ''.join(p.read_text(encoding='utf-8') for p in parts)
          acc = 0; nbits = 0; out = bytearray()
          for ch in text:
              v = ord(ch) - 0x3400
              if not 0 <= v < 32768:
                  raise SystemExit('Invalid transfer character')
              acc = (acc << 15) | v
              nbits += 15
              while nbits >= 8:
                  nbits -= 8
                  out.append((acc >> nbits) & 0xff)
                  acc &= (1 << nbits) - 1 if nbits else 0
          candidates = [bytes(out)]
          if nbits:
              for tail in range(1 << (8 - nbits)):
                  candidates.append(bytes(out) + bytes([(acc << (8 - nbits)) | tail]))
          dest = Path('/tmp/mechthild-package')
          for package in candidates:
              try:
                  if dest.exists():
                      import shutil; shutil.rmtree(dest)
                  dest.mkdir(exist_ok=True)
                  with tarfile.open(fileobj=io.BytesIO(package), mode='r:xz') as tf:
                      tf.extractall(dest)
                  print('Decoded transfer bytes:', len(package))
                  print('Decoded transfer SHA256:', hashlib.sha256(package).hexdigest())
                  break
              except Exception:
                  continue
          else:
              raise SystemExit('Recovery archive is invalid after tail-bit recovery')
          PY

      - name: Verify current uploaded source byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/tmp/mechthild-package/books/christianity/mechthild/chapters')
          files = sorted(root.glob('*.md'))
          if len(files) != 44:
              raise SystemExit(f'Expected 44 chapters, found {len(files)}')
          h = hashlib.sha256()
          for p in files:
              h.update(p.name.encode('utf-8')); h.update(b'\0')
              h.update(p.read_bytes()); h.update(b'\0')
          expected = '571c2256bff1402ab9844e9d7e89bd5363d0f7568deebaba3dd031729de7deed'
          got = h.hexdigest()
          print('Chapter aggregate SHA256:', got)
          if got != expected:
              raise SystemExit('Recovered package differs from the current uploaded ZIP')
          required = [
              Path('/tmp/mechthild-package/books/christianity/mechthild/book.yaml'),
              Path('/tmp/mechthild-package/books/christianity/mechthild/manifest.json'),
              Path('/tmp/mechthild-package/site/christianity/mechthild/index.html'),
              Path('/tmp/mechthild-package/site/christianity/mechthild/app.js'),
              Path('/tmp/mechthild-package/site/christianity/mechthild/style.css'),
              Path('/tmp/mechthild-package/site/christianity/mechthild/chapters.json'),
              Path('/tmp/mechthild-package/site/index.html'),
              Path('/tmp/mechthild-package/.github/workflows/deploy-pages.yml'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'Missing publication files: {missing}')
          print('Verified: 44 byte-identical Markdown chapters and publication metadata/site.')
          PY

      - name: Install publication without touching existing books
        shell: bash
        run: |
          set -euo pipefail
          test ! -e books/christianity/mechthild
          test ! -e site/christianity/mechthild
          mkdir -p books/christianity site/christianity
          cp -a /tmp/mechthild-package/books/christianity/mechthild books/christianity/
          cp -a /tmp/mechthild-package/site/christianity/mechthild site/christianity/
          cp /tmp/mechthild-package/site/index.html site/index.html
          cp /tmp/mechthild-package/.github/workflows/deploy-pages.yml .github/workflows/deploy-pages.yml
          test "$(find books/christianity/mechthild/chapters -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = 44

      - name: Commit complete publication in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/christianity/mechthild
          git add site/index.html site/christianity/mechthild
          git add .github/workflows/deploy-pages.yml
          git rm -r .webbook-upload/mechthild
          git rm .github/workflows/publish-mechthild-once.yml
          git commit -m 'Publish Mechthild webbook'
          git push origin HEAD:main
