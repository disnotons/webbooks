name: Finalize Mechthild once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mechthild-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read verified source package from retained branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mechthild-publish-final-trigger:refs/remotes/origin/mechthild-publish-final-trigger
          mkdir -p /tmp/mechthild-parts
          for n in 01 02 03 04; do
            git show "origin/mechthild-publish-final-trigger:.webbook-upload/mechthild/part-${n}.txt" > "/tmp/mechthild-parts/part-${n}.txt"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, shutil, tarfile
          parts = sorted(Path('/tmp/mechthild-parts').glob('part-*.txt'))
          text = ''.join(p.read_text(encoding='utf-8') for p in parts)
          acc = 0; nbits = 0; out = bytearray()
          for ch in text:
              v = ord(ch) - 0x3400
              if not 0 <= v < 32768:
                  raise SystemExit('Invalid transfer character')
              acc = (acc << 15) | v
              nbits += 15
              while nbits >= 8:
                  nbits -= 8
                  out.append((acc >> nbits) & 0xff)
                  acc &= (1 << nbits) - 1 if nbits else 0
          candidates = [bytes(out)]
          if nbits:
              candidates += [bytes(out) + bytes([(acc << (8 - nbits)) | tail])
                             for tail in range(1 << (8 - nbits))]
          dest = Path('/tmp/mechthild-package')
          for package in candidates:
              try:
                  shutil.rmtree(dest, ignore_errors=True)
                  dest.mkdir()
                  with tarfile.open(fileobj=io.BytesIO(package), mode='r:xz') as tf:
                      tf.extractall(dest)
                  break
              except Exception:
                  continue
          else:
              raise SystemExit('Verified recovery archive could not be decoded')
          root = dest / 'books/christianity/mechthild/chapters'
          files = sorted(root.glob('*.md'))
          if len(files) != 44:
              raise SystemExit(f'Expected 44 chapters, found {len(files)}')
          h = hashlib.sha256()
          for p in files:
              h.update(p.name.encode('utf-8')); h.update(b'\0')
              h.update(p.read_bytes()); h.update(b'\0')
          expected = '571c2256bff1402ab9844e9d7e89bd5363d0f7568deebaba3dd031729de7deed'
          got = h.hexdigest()
          print('Chapter aggregate SHA256:', got)
          if got != expected:
              raise SystemExit('Recovered package differs from verified 44-chapter source')
          if not (dest / 'books/christianity/mechthild/book.yaml').is_file():
              raise SystemExit('book.yaml missing')
          PY

      - name: Replace only Mechthild book data and validate engine
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          rm -rf books/christianity/mechthild
          mkdir -p books/christianity/mechthild
          cp /tmp/mechthild-package/books/christianity/mechthild/book.yaml books/christianity/mechthild/book.yaml
          cp -a /tmp/mechthild-package/books/christianity/mechthild/chapters books/christianity/mechthild/chapters
          test "$(find books/christianity/mechthild/chapters -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = 44
          python tools/build_site.py --books books --site site --output _site

      - name: Commit complete book once and remove this runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/christianity/mechthild
          git rm -- .github/workflows/finalize-mechthild-once.yml
          bad="$(git diff --cached --name-only | grep -Ev '^(books/christianity/mechthild/|\.github/workflows/finalize-mechthild-once\.yml$)' || true)"
          test -z "$bad"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git commit -m 'Publish complete Mechthild webbook'
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
