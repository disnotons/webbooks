name: Publish AA GitBook once

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitbook-aa-run'
      - '.aa-transfer/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication package from PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reassemble and verify prepared GitBook package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .aa-transfer -maxdepth 1 -name 'part-*.b64' | wc -l)" = '16'
          cat .aa-transfer/part-*.b64 | base64 -d > /tmp/aa-gitbook.tar.bz2
          got="$(sha256sum /tmp/aa-gitbook.tar.bz2 | awk '{print $1}')"
          expected='352fa8dd18cd8e858ac96383bf10f657daa4027dc81c5413b8945996b83563f3'
          echo "package sha256: $got"
          test "$got" = "$expected"
          rm -rf /tmp/gitbook-aa
          mkdir -p /tmp/gitbook-aa
          tar -xjf /tmp/aa-gitbook.tar.bz2 -C /tmp/gitbook-aa
          test -f /tmp/gitbook-aa/.gitbook.yaml
          test -f /tmp/gitbook-aa/README.md
          test -f /tmp/gitbook-aa/SUMMARY.md
          test "$(find /tmp/gitbook-aa/chapters -type f -name '*.md' | wc -l)" = '74'

      - name: Publish clean one-commit GitBook branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan gitbook-aa-build
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/gitbook-aa/. .
          test "$(find chapters -type f -name '*.md' | wc -l)" = '74'
          git add -- .gitbook.yaml README.md SUMMARY.md chapters
          git commit -m 'Publish AA Twelve Traditions for GitBook'
          git push --force origin HEAD:gitbook-aa
