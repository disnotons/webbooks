name: Recover AA baseline artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-aa-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download retained source slices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa-old
          base='https://raw.githubusercontent.com/disnotons/GPT/main/.webbook-upload/aa-traditions-detailed'
          for n in part-00.b64 part-01.b64 part-02.b64 part-03.b64 part-04.b64 part-05.b64 part-06.b64 part-07.b64 part-08.b64 part-04-new.b64 part-05-new.b64 part-06-new.b64; do
            curl -fsSL "$base/$n" -o "/tmp/aa-old/$n"
          done
      - name: Extract candidate integrated Markdown files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,bz2,io,tarfile,hashlib,shutil
          root=Path('/tmp/aa-old')
          out=Path('/tmp/aa-baselines'); out.mkdir()
          sets=[
            ['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05.b64','part-06.b64','part-07.b64','part-08.b64'],
            ['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04-new.b64','part-05-new.b64','part-06-new.b64','part-07.b64','part-08.b64'],
          ]
          for i,names in enumerate(sets,1):
              try:
                  enc=''.join((root/n).read_text() for n in names)
                  raw=base64.b64decode(''.join(enc.split()),validate=True)
                  tar=bz2.decompress(raw)
                  d=out/f'candidate-{i}'; d.mkdir()
                  with tarfile.open(fileobj=io.BytesIO(tar),mode='r:') as tf: tf.extractall(d,filter='data')
                  m=list(d.rglob('AA_12전통_상세분석해설_전체통합본_친절한설명조.md'))
                  if len(m)==1:
                      dst=out/f'candidate-{i}.md'; shutil.copyfile(m[0],dst)
                      print(i,len(dst.read_bytes()),hashlib.sha256(dst.read_bytes()).hexdigest())
              except Exception as e:
                  print('candidate',i,'failed:',e)
          PY
          ls -l /tmp/aa-baselines/*.md
      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: aa-baselines
          path: /tmp/aa-baselines/*.md
          if-no-files-found: error
