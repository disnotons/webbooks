name: Export all AA historical source slices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-aa-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Record run id first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .webbook-debug
          printf '%s\n' "$GITHUB_RUN_ID" > .webbook-debug/aa-baseline-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .webbook-debug/aa-baseline-run.txt
          git commit -m 'Record AA baseline artifact run'
          git push origin HEAD:main
      - name: Download every retained file version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,json,hashlib,os
          repo='disnotons/GPT'; root='.webbook-upload/aa-traditions-detailed'
          names=[f'part-{i:02d}.b64' for i in range(9)] + [
            'part-04-new.b64','part-05-new.b64','part-06-new.b64',
            'current-part-04.b64','current-part-06.b64','current-part-07.b64','current-part-08.b64','current-part-09.b64'
          ]
          token=os.environ['GH_TOKEN']; out=Path('/tmp/aa-all-history'); out.mkdir()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'webbooks-recovery','Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          index={}
          for name in names:
              path=f'{root}/{name}'
              q=urllib.parse.quote(path,safe='')
              try: commits=json.loads(get(f'https://api.github.com/repos/{repo}/commits?path={q}&per_page=100'))
              except Exception as e:
                  index[name]={'error':str(e)}; continue
              seen=set(); rows=[]
              for c in commits:
                  sha=c['sha']
                  try: data=get(f'https://raw.githubusercontent.com/{repo}/{sha}/{path}')
                  except Exception: continue
                  h=hashlib.sha256(data).hexdigest()
                  if h in seen: continue
                  seen.add(h)
                  fn=f'{name}__{sha[:8]}__{h[:12]}.txt'; (out/fn).write_bytes(data)
                  rows.append({'commit':sha,'sha256':h,'size':len(data),'file':fn})
              index[name]=rows
              print(name,[(r['commit'][:8],r['size']) for r in rows])
          (out/'index.json').write_text(json.dumps(index,indent=2)+'\n')
          PY
      - name: Upload all historical slices
        uses: actions/upload-artifact@v4
        with:
          name: aa-all-historical-slices
          path: /tmp/aa-all-history
          if-no-files-found: error
