name: Export AA historical source slices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-aa-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Record run id first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .webbook-debug
          printf '%s\n' "$GITHUB_RUN_ID" > .webbook-debug/aa-baseline-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .webbook-debug/aa-baseline-run.txt
          git commit -m 'Record AA baseline artifact run'
          git push origin HEAD:main
      - name: Download historical source slices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          repo='disnotons/GPT'; path='.webbook-upload/aa-traditions-detailed'
          variants={
            'part-00.b64':['dffbf603','6c3d3e39'],
            'part-01.b64':['d3d38793','464c41bf','f4782266'],
            'part-02.b64':['eef28158','b3917da9'],
            'part-03.b64':['86d54385','a4bb726f'],
            'part-04.b64':['2bfae17d','7f565c87'],
            'part-05.b64':['e449ae06','32a9f983'],
            'part-06.b64':['d64e9b53','35f8af05'],
            'part-07.b64':['78a2c4cd'],
            'part-08.b64':['2c0b79e8'],
          }
          out=Path('/tmp/aa-history'); out.mkdir()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'webbooks-recovery'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for name,refs in variants.items():
              for short in refs:
                  full=json.loads(get(f'https://api.github.com/repos/{repo}/commits/{short}'))['sha']
                  data=get(f'https://raw.githubusercontent.com/{repo}/{full}/{path}/{name}')
                  (out/f'{name}__{short}.txt').write_bytes(data)
                  print(name,short,len(data))
          PY
      - name: Upload historical slices
        uses: actions/upload-artifact@v4
        with:
          name: aa-historical-slices
          path: /tmp/aa-history
          if-no-files-found: error
